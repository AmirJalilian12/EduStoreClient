<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="modal-header d-flex justify-content-between align-items-center">
    <h5 class="modal-title fw-bold text-dark m-0">{{ title }}</h5>
    <button
      type="button"
      class="btn-close m-0"
      aria-label="بستن"
      (click)="bsModalRef.hide()"
    ></button>
  </div>

  <div class="modal-body">
    <div class="row g-2">
      <div class="col-12 col-md-6">
        <app-input
          formControlName="firstName"
          type="text"
          label="نام"
          placeholder="نام"
        ></app-input>
      </div>

      <div class="col-12 col-md-6">
        <app-input
          formControlName="lastName"
          type="text"
          label="نام خانوادگی"
          placeholder="نام خانوادگی"
        ></app-input>
      </div>

      <div class="col-12 col-md-6">
        <app-input
          formControlName="number"
          type="text"
          label="شماره همراه"
          placeholder="شماره همراه"
        ></app-input>
      </div>

      <div class="col-12 col-md-6">
        <app-input
          formControlName="postalCode"
          type="text"
          label="کد پستی"
          placeholder="کد پستی"
        ></app-input>
      </div>

      <div class="col-12 col-md-6">
        <app-input
          formControlName="state"
          type="text"
          label="استان"
          placeholder="استان"
        ></app-input>
      </div>

      <div class="col-12 col-md-6">
        <app-input
          formControlName="city"
          type="text"
          label="شهر"
          placeholder="شهر"
        ></app-input>
      </div>

      <div class="col-12">
        <app-input
          formControlName="fullAddress"
          type="text"
          label="آدرس کامل"
          placeholder="آدرس کامل"
        ></app-input>
      </div>
    </div>

    <div class="form-check form-switch mt-3 py-2 px-4 border rounded d-flex align-items-center gap-2">
      <input
        class="form-check-input ms-0"
        type="checkbox"
        role="switch"
        formControlName="isMain"
        id="flexSwitchCheckDefault"
      />
      <label class="form-check-label user-select-none" for="flexSwitchCheckDefault">
        انتخاب به عنوان آدرس پیش‌فرض
      </label>
    </div>
  </div>

  <div class="modal-footer">
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
      ثبت آدرس
    </button>
    <button type="button" class="btn btn-secondary" (click)="bsModalRef.hide()">
      {{ closeBtnName }}
    </button>
  </div>
</form>
