<mat-sidenav-container>
    <mat-sidenav [opened]="sidenavOpen" [mode]="sidenavOpen ? 'side' : 'over'" class="mat-sidenav">
        <app-shop-filters (updateParams)="updateParams($event)"></app-shop-filters>
    </mat-sidenav>
    <mat-sidenav-content class="mat-content">
      <div class="row container w-75">
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" #search (keyup.enter)="onSearch()">
          <button class="btn btn-outline-success" type="submit" (click)="onSearch()">Search</button>
          <button class="btn btn-outline-danger" type="submit" (click)="onReset()">حذف</button>
        </form>
      </div>
      <div class="container py-4">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
        <app-card-shop
        *ngFor="let item of data?.result"
        [product]="item">
        </app-card-shop>
  </div>
  <div class="row" *ngIf="data?.result?.length >0">
    <div class="col-xs-12 col-12">
      <pagination
      (pageChanged)="onPageChange($event)"
      [totalItems]="data.count"
      [itemsPerPage]="shopParams.pageSize"
      [(ngModel)] ="shopParams.pageIndex"
      previousText="&lsaquo;"
      nextText="&rsaquo;"
      firstText="laquo;"
      lastText="raquo;"
      >
      </pagination>
    </div>
  </div>
  <!-- حالت خالی -->
  <div *ngIf="!data?.result?.length" class="text-center text-muted py-5">
    محصولی برای نمایش وجود ندارد.
  </div>
</div>
    </mat-sidenav-content>
</mat-sidenav-container>
